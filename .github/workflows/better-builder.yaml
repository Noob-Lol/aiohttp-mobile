name: Build Android Wheels

on:
  schedule:
    - cron: '0 6 * * *'   # daily: check all packages for new PyPI releases

  workflow_dispatch:
    inputs:
      package:
        description: 'Package name to build (leave blank to check all in packages.toml)'
        required: false
        default: ''
      version:
        description: 'Exact version (only used with package input; blank = latest)'
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild even if release already exists'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build without publishing to release'
        required: false
        default: false
        type: boolean
      debug:
        description: 'Enable PYO3_PRINT_CONFIG for debugging (crashes build)'
        required: false
        default: false
        type: boolean

env:
  WHEEL_PY_TAGS: cp313-cp314

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Resolve: check each package against existing releases, emit build matrix
  # ───────────────────────────────────────────────────────────────────────────
  resolve:
    name: Resolve
    runs-on: ubuntu-latest
    outputs:
      matrix:       ${{ steps.resolve.outputs.matrix }}
      any_to_build: ${{ steps.resolve.outputs.any_to_build }}

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Run resolve.py
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PACKAGE: ${{ github.event.inputs.package || '' }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true }}
        run: |
          args=()
          if [[ -n "$INPUT_PACKAGE" ]]; then
            args+=(--package "$INPUT_PACKAGE")
          fi
          if [[ -n "$INPUT_VERSION" ]]; then
            args+=(--version "$INPUT_VERSION")
          fi
          if [[ "$INPUT_FORCE_REBUILD" == "true" ]]; then
            args+=(--force)
          fi
          uv run scripts/resolve.py "${args[@]}"

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Build: one job per (package x arch)
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: ${{ matrix.pkg.name }} ${{ matrix.pkg.version }} / ${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.any_to_build == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pkg:  ${{ fromJson(needs.resolve.outputs.matrix).include }}
        arch: [arm64_v8a, x86_64]

    steps:
      - if: matrix.pkg.name == '__skip__'
        run: echo "Nothing to build." && exit 0

      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Install cibuildwheel
        run: uv tool install cibuildwheel

      - name: Cache built wheel
        id: wheel-cache
        uses: actions/cache@v5
        with:
          path: wheelhouse
          key: wheel-android-${{ matrix.arch }}-${{ matrix.pkg.name }}-${{ matrix.pkg.version }}-${{ env.WHEEL_PY_TAGS }}

      - name: Download and unpack sdist
        if: steps.wheel-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        run: |
         PKG="${{ matrix.pkg.name }}"
         VER="${{ matrix.pkg.version }}"
         mkdir -p work/dist work/src
         uv run scripts/download_sdist.py "$PKG" "$VER" -d work/dist
         tar -xf work/dist/*.tar.gz -C work/src
         SRCDIR=$(ls -d work/src/*/ | head -1)
         echo "SDIST_SOURCE_DIR=${SRCDIR%/}" >> "$GITHUB_ENV"

      - name: Patch sdist
        if: matrix.pkg.patch != '' && (steps.wheel-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true))
        env:
          PATCH: ${{ matrix.pkg.patch }}
        run: |
          PATCH="${PATCH//\{project\}/$SDIST_SOURCE_DIR}"
          echo "Applying patch: $PATCH"
          bash -c "$PATCH"

      - name: Download Android source deps
        if: matrix.pkg.android_source_deps != null && matrix.pkg.android_source_deps != '' && (steps.wheel-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true))
        env:
          ARCH: ${{ matrix.arch }}
          ANDROID_SOURCE_DEPS: ${{ matrix.pkg.android_source_deps }}
        run: |
          mkdir -p work/android-deps
          read -ra deps <<< "$ANDROID_SOURCE_DEPS"
          extra_env="$(uv run scripts/download_android_source_dep.py "${deps[@]}" --arch "$ARCH" --dest work/android-deps)"
          extra_env="${extra_env//$'\n'/ }"

          {
            echo "EXTRA_CIBW_ENVIRONMENT_ANDROID<<EOF"
            printf '%s\n' "$extra_env"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Update Rust toolchain if needed
        if: steps.wheel-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        run: |
          if ! find "$SDIST_SOURCE_DIR" -maxdepth 3 -name Cargo.toml -print -quit | grep -q .; then
            echo "No Cargo.toml found; skipping Rust toolchain update."
            exit 0
          fi
          rustup set profile minimal
          rustup update stable
          rustup default stable
          rustc --version

      - name: Build wheel
        if: steps.wheel-cache.outputs.cache-hit != 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        env:
          CIBW_PLATFORM:              android
          CIBW_ARCHS_ANDROID:         ${{ matrix.arch }}
          CIBW_BUILD_FRONTEND:        build[uv]
          CIBW_TEST_SKIP:             '*'
          BASE_CIBW_ENVIRONMENT_ANDROID: ${{ matrix.pkg.cibw_environment || '' }}
          BASE_CIBW_BEFORE_BUILD_ANDROID: ${{ matrix.pkg.cibw_before_build || '' }}
          ANDROID_API_LEVEL:          '24'
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ matrix.pkg.version }}
          PYO3_PRINT_CONFIG:          ${{ (github.event_name == 'workflow_dispatch' && inputs.debug == true) && '1' || '' }}
        run: |
          cibw_env="${EXTRA_CIBW_ENVIRONMENT_ANDROID:-}"
          if [[ -n "${BASE_CIBW_ENVIRONMENT_ANDROID:-}" ]]; then
            cibw_env="${cibw_env:+$cibw_env }$BASE_CIBW_ENVIRONMENT_ANDROID"
          fi
          if [[ -n "$cibw_env" ]]; then
            export CIBW_ENVIRONMENT_ANDROID="$cibw_env"
          fi
          CIBW_BEFORE_BUILD_ANDROID=""
          if find "$SDIST_SOURCE_DIR" -maxdepth 3 -name Cargo.toml -print -quit | grep -q .; then
            CIBW_BEFORE_BUILD_ANDROID="uv pip install maturin==1.13.1"
          fi
          if [[ -n "${BASE_CIBW_BEFORE_BUILD_ANDROID:-}" ]]; then
            CIBW_BEFORE_BUILD_ANDROID="${CIBW_BEFORE_BUILD_ANDROID:+$CIBW_BEFORE_BUILD_ANDROID && }$BASE_CIBW_BEFORE_BUILD_ANDROID"
          fi
          if [[ -n "$CIBW_BEFORE_BUILD_ANDROID" ]]; then
            export CIBW_BEFORE_BUILD_ANDROID
          fi
          cd "$SDIST_SOURCE_DIR"
          cibuildwheel --output-dir "$GITHUB_WORKSPACE/wheelhouse"

      # - name: Debug with tmate
      #   if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
      #   uses: mxschmitt/action-tmate@v3
      #   timeout-minutes: 30
      #   with:
      #     limit-access-to-actor: true

      - name: Verify libpython linkage
        run: |
          for whl in wheelhouse/*.whl; do
            echo "Checking $whl"
            unzip -p "$whl" "*.so" 2>/dev/null | \
              python3 -c "
          import sys, subprocess, tempfile, os
          data = sys.stdin.buffer.read()
          with tempfile.NamedTemporaryFile(suffix='.so', delete=False) as f:
              f.write(data); name = f.name
          out = subprocess.check_output(['readelf', '-d', name], text=True)
          os.unlink(name)
          needed = [l for l in out.splitlines() if 'NEEDED' in l]
          print('\n'.join(needed))
          has_libpython = any('libpython' in l for l in needed)
          if not has_libpython:
              print('ERROR: no libpython in NEEDED', file=sys.stderr)
              sys.exit(1)
          "
          done
      
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg.name }}-${{ matrix.pkg.version }}-android-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Publish: create a GitHub Release per package
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish ${{ matrix.pkg.name }} ${{ matrix.pkg.version }}
    needs: [resolve, build]
    if: always() && needs.resolve.outputs.any_to_build == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJson(needs.resolve.outputs.matrix).include }}

    steps:
      - if: matrix.pkg.name == '__skip__'
        run: echo "Nothing to publish." && exit 0

      - name: Download wheels for ${{ matrix.pkg.name }}
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: dist/
          pattern: ${{ matrix.pkg.name }}-${{ matrix.pkg.version }}-android-*
          merge-multiple: true

      - name: Check package artifact availability
        id: package-artifacts
        shell: bash
        run: |
          if compgen -G "dist/*.whl" > /dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No wheel artifacts found for ${{ matrix.pkg.name }}-${{ matrix.pkg.version }}; skipping publish."
          fi

      - name: Create GitHub Release
        if: steps.package-artifacts.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.pkg.name }}"
          VER="${{ matrix.pkg.version }}"
          TAG="${{ matrix.pkg.tag }}"

          # Parse built wheel files to determine wheel type and python versions
          shopt -s nullglob

          WHEEL_TYPE="Unknown"
          PY_VERSIONS=""

          # 1. Extract tags (Counting from the end is safer for wheel names)
          raw_tags=$(for f in dist/*.whl; do
            basename "$f" .whl | awk -F'-' '{print $(NF-2), $(NF-1)}'
          done)

          py_tags=$(echo "$raw_tags" | awk '{print $1}' | tr '.' '\n' | sort -u)
          abi_tags=$(echo "$raw_tags" | awk '{print $2}' | sort -u)

          # 2. Determine Wheel Type (Mutually Exclusive)
          if [[ "$abi_tags" =~ "abi3" ]]; then
            WHEEL_TYPE="Stable ABI"
          elif [[ "$abi_tags" =~ cp[0-9]+ ]]; then
            WHEEL_TYPE="CPython normal"
          fi

          # 3. Process Versions into comma-space separated string
          mapfile -t v_array < <(echo "$py_tags" | grep -o 'cp3[0-9]*' | sed 's/cp3/3./' | sort -uV)

          if [ ${#v_array[@]} -gt 0 ]; then
            printf -v PY_VERSIONS "%s, " "${v_array[@]}"
            PY_VERSIONS="${PY_VERSIONS%, }" 
            [[ "$WHEEL_TYPE" == "Stable ABI" ]] && PY_VERSIONS="${PY_VERSIONS}+"
          else
            PY_VERSIONS="Unknown"
          fi

          shopt -u nullglob

          BODY="| ABI | Target |
          |---|---|
          | \`arm64_v8a\` | Physical devices (Android 7+, API 24) |
          | \`x86_64\`    | Emulators |

          **Wheel Type:** ${WHEEL_TYPE}
          **CPython:** ${PY_VERSIONS}

          Built from PyPI sdist by GitHub Actions.
          "

          gh release create "$TAG" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --title "${PKG} ${VER} — Android wheels" \
            --notes "$BODY" \
          || gh release upload "$TAG" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
