# packages.toml
# Packages to build Android wheels for, checked daily against PyPI.
#
# Fields:
#   name              – PyPI package name (required)
#   pin               – lock to a specific version; omit to always build latest
#   cibw_environment  – extra env vars for CIBW_ENVIRONMENT_ANDROID (optional)
#   cibw_before_build – commands to run before building via CIBW_BEFORE_BUILD_ANDROID (optional)
#   patch             – arbitrary commands before the "before build" if it's too late
#   android_source_deps – Android native deps in form { lib = "version-rev" } (optional)

# aiohttp + deps
[[package]]
name = "aiohttp"

[[package]]
name = "frozenlist"

[[package]]
name = "multidict"

[[package]]
name = "propcache"

[[package]]
name = "yarl"

# aio speed
[[package]]
name = "pycares"

[[package]]
name = "brotli"

# niquests compiled <3
[[package]]
name = "charset_normalizer"
cibw_environment = { PIP_NO_BINARY = "mypy", CHARSET_NORMALIZER_USE_MYPYC = "1" }

[[package]]
name = "jh2"
patch = "sed -i 's/abi3-py3[0-9][0-9]*/abi3-py313/g' {project}/Cargo.toml {project}/pyproject.toml"

[[package]]
name = "qh3"
cibw_environment = { BINDGEN_EXTRA_CLANG_ARGS = "--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" }
patch = "sed -i 's/abi3-py3[0-9][0-9]*/abi3-py313/g' {project}/Cargo.toml {project}/pyproject.toml"

# speedups
[[package]]
name = "orjson"

# other
[[package]]
name = "uvloop"
android_source_deps = { libuv = "1.52.1" }
patch = [
    "sed -i 's/self.use_system_libuv = False/self.use_system_libuv = True/; s/self.compiler.add_library(.pthread.)//g' {project}/setup.py",
    "sed -i '/if self.use_system_libuv:/a \\            d=os.environ.get(\"LIBUV_DIR\"); self.compiler.add_include_dir(os.path.join(d,\"include\")); self.compiler.add_library_dir(os.path.join(d,\"lib\")); self.extensions[-1].extra_objects.append(os.path.join(d,\"lib\",\"libuv.a\"))' {project}/setup.py",
]

[[package]]
name = "psutil"
patch = "sed -i 's/sys.platform.startswith(\"linux\")/sys.platform.startswith((\"linux\", \"android\"))/g' {project}/psutil/_common.py"

[[package]]
name = "msgspec"

[[package]]
name = "websockets"

[[package]]
name = "pydantic_core"

[[package]]
name = "watchfiles"

[[package]]
name = "cffi"
android_source_deps = { libffi = "3.4.4-3" }
patch = "sed -i 's|^\\([[:space:]]*\\)use_pkg_config()|\\1d=os.environ.get(\"LIBFFI_ANDROID_DIR\"); include_dirs.append(os.path.join(d,\"include\")); library_dirs.append(os.path.join(d,\"lib\"))|' {project}/setup.py"

[[package]]
name = "cryptography"
cibw_environment = { OPENSSL_STATIC = "1", CRYPTOGRAPHY_BUILD_OPENSSL_NO_LEGACY = "1" }
android_source_deps = { openssl = "3.5.6-0" }

#[[package]]
#name = "numpy"

[[package]]
name = "jiter"

[[package]]
name = "hiredis"

[[package]]
name = "pymongo"

[[package]]
name = "audioop-lts"

[[package]]
name = "lxml"
cibw_environment = { STATIC = "1" }
android_source_deps = { libxslt = "1.1.45" }
patch = "sed -i 's|shell=True,|shell=True, executable=\"/bin/sh\",|g' {project}/setupinfo.py"

[[package]]
name = "zstandard"

[[package]]
name = "MarkupSafe"

[[package]]
name = "lz4"

[[package]]
name = "regex"

[[package]]
name = "httptools"

[[package]]
name = "greenlet"

[[package]]
name = "bcrypt"

[[package]]
name = "argon2-cffi-bindings"
patch = "sed -i 's/pp3[0-9][0-9]*-//g' {project}/pyproject.toml"

[[package]]
name = "pillow"

[[package]]
name = "opencv-python"
pin = "4.12.0.88"
