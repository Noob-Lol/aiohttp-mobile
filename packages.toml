# packages.toml
# Packages to build Android wheels for, checked daily against PyPI.
#
# Fields:
#   name              – PyPI package name (required)
#   pin               – lock to a specific version; omit to always build latest
#   cibw_environment  – extra env vars for CIBW_ENVIRONMENT_ANDROID (optional)
#   cibw_before_build – commands to run before building via CIBW_BEFORE_BUILD_ANDROID (optional)
#   recipes           – list of built-in recipes e.g. ["abi3_min_version"] (optional)
#   patches           – compact list of search/replace or regex patches (optional)
#   patch             – legacy shell commands before build (optional)
#   android_source_deps – Android native deps in form { lib = "version-rev" } (optional)

# aiohttp + deps
# [[package]]
# name = "aiohttp"
# aiohttp 3.14.0+ got official Android (and iOS) wheels, so no need for this anymore

[[package]]
name = "frozenlist"

[[package]]
name = "multidict"

[[package]]
name = "propcache"

[[package]]
name = "yarl"

# aio speed
[[package]]
name = "pycares"

[[package]]
name = "brotli"

# niquests compiled <3
[[package]]
name = "charset_normalizer"
cibw_environment = { CHARSET_NORMALIZER_USE_MYPYC = "1" }
cibw_before_build = "uv pip install --no-build-isolation --no-deps --reinstall-package mypy --no-binary mypy mypy"

[[package]]
name = "jh2"
recipes = ["abi3_min_version"]

[[package]]
name = "qh3"
cibw_environment = { BINDGEN_EXTRA_CLANG_ARGS = "--sysroot=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot" }
recipes = ["abi3_min_version"]

# speedups
[[package]]
name = "orjson"

# mypy
[[package]]
name = "mypy"
cibw_environment = { MYPY_USE_MYPYC = 1 }

[[package]]
name = "librt"

[[package]]
name = "ast-serialize"
recipes = ["abi3_min_version"]

# pydantic
[[package]]
name = "pydantic_core"

#[[package]]
#name = "pydantic-monty"

[[package]]
name = "jiter"

# other
[[package]]
name = "uvloop"
android_source_deps = { libuv = "1.52.1" }
patches = [
  { file = "setup.py", search = "self.use_system_libuv = False", replace = "self.use_system_libuv = True" },
  { file = "setup.py", pattern = 'self\.compiler\.add_library\(.pthread.\)', replace = "" },
  { file = "setup.py", after = "if self.use_system_libuv:", insert = '            d = os.environ.get("LIBUV_DIR"); self.compiler.add_include_dir(os.path.join(d, "include")); self.compiler.add_library_dir(os.path.join(d, "lib")); self.extensions[-1].extra_objects.append(os.path.join(d, "lib", "libuv.a"))' },
]

[[package]]
name = "psutil"
patches = [
  { file = "psutil/_common.py", search = 'sys.platform.startswith("linux")', replace = 'sys.platform.startswith(("linux", "android"))' },
]

[[package]]
name = "msgspec"

[[package]]
name = "websockets"

[[package]]
name = "watchfiles"

[[package]]
name = "cffi"
android_source_deps = { libffi = "3.4.4-3" }
patches = [
  { file = "setup.py", pattern = '^(\s*)use_pkg_config\(\)', replace = '\1d = os.environ.get("LIBFFI_ANDROID_DIR"); include_dirs.append(os.path.join(d, "include")); library_dirs.append(os.path.join(d, "lib"))' },
]

[[package]]
name = "cryptography"
cibw_environment = { OPENSSL_STATIC = "1" }
android_source_deps = { openssl = "3.5.8" }
patches = [
  { file = "src/rust/cryptography-cffi/build.rs", pattern = 'let py_ver = lib\s+\.file_name\(\)\s+\.and_then\(\|s\| s\.to_str\(\)\)\s+\.unwrap_or\("python3"\);', replace = 'let py_ver = "python3.13";' },
  { file = "src/rust/cryptography-cffi/build.rs", pattern = '\.parent\(\)\s+\.and_then\(\|p\| p\.parent\(\)\)\s+\.expect\("PYO3_CROSS_LIB_DIR has unexpected layout"\)', replace = '.parent()\n        .expect("PYO3_CROSS_LIB_DIR has unexpected layout")' },
]
